<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ร้านค้าผจญภัย — D&D Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>ร้านค้าแห่งดันเจี้ยน</h1>
    <p class="tagline">ใช้งานร้านค้าเป็น Player หรือ DM?</p>
    
    <div class="role-selector">
      <button type="button" class="role-btn active" data-role="player" onclick="selectRole('player'); return false;">🎲 Player</button>
      <button type="button" class="role-btn" data-role="dm" onclick="selectRole('dm'); return false;">👑 DM</button>
      <button type="button" class="role-btn" data-role="admin" onclick="selectRole('admin'); return false;">🛠️ Admin</button>
    </div>

    <div class="login-form">
      <div class="input-group">
        <label>ชื่อผู้ใช้ (Username)</label>
        <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" onkeydown="if(event.key==='Enter') document.getElementById('password').focus()">
      </div>
      <div class="input-group">
        <label>รหัสผ่าน (Password)</label>
        <input type="password" id="password" placeholder="กรอกรหัสผ่าน" onkeydown="if(event.key==='Enter') enterShop()">
      </div>
      <div id="errorMsg" class="error-msg"></div>
    </div>

    <button type="button" class="enter-btn" onclick="enterShop()">เข้าสู่ระบบ</button>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
