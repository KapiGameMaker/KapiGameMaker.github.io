<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ร้านค้าผจญภัย — D&D Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>ร้านค้าแห่งดันเจี้ยน</h1>
    <p class="tagline">เข้าเล่นเป็นผู้เล่นหรือ DM</p>
    
    <div class="role-selector">
      <button type="button" class="role-btn active" onclick="selectRole('player'); return false;">🎲 ผู้เล่น (Player)</button>
      <button type="button" class="role-btn" onclick="selectRole('dm'); return false;">👑 ผู้จัดเล่น (DM)</button>
    </div>

    <div id="dmSection" class="dm-login hidden">
      <label>รหัส DM</label>
      <input type="password" id="dmCode" placeholder="กรอกรหัสผ่าน" onkeydown="if(event.key==='Enter') enterShop()">
      <div id="errorMsg" class="error-msg"></div>
    </div>

    <button type="button" class="enter-btn" onclick="enterShop()">เข้าสู่ร้านค้า</button>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
