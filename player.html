<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผู้เล่น — D&D Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1 id="shopTitle">ร้านค้าแห่งดันเจี้ยน</h1>
    <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
  </div>

  <button class="refresh-shop-btn" onclick="playerRefreshShop()">🔄 รีเฟรชร้านค้า</button>
  <p class="subtitle">คำนวณทองและซื้อไอเทม — ระบบจะแจ้งรายการให้ DM ทราบโดยอัตโนมัติ</p>

  <div class="setup">
    <div class="field">
      <label>ชื่อตัวละคร</label>
      <input type="text" id="charName" placeholder="ชื่อตัวละคร" value="" readonly>
    </div>
    <div class="field">
      <label>ทองตั้งต้น (gp)</label>
      <input type="number" id="startGold" value="100" min="0">
    </div>
  </div>

  <div class="purse">
    <span class="label">ถุงทองคงเหลือ</span>
    <span class="amount" id="goldDisplay">100 gp</span>
  </div>

  <div class="section">
    <div class="ledger-title">สินค้าในร้าน <span class="hint">กดซื้อเพื่อหักทองอัตโนมัติ</span></div>
    <div style="margin-bottom: 12px;">
      <input type="text" id="searchInput" placeholder="🔍 ค้นหาไอเทมหรือหมวดหมู่..." oninput="handleSearch(this.value)" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); font-family: inherit; background: rgba(255,255,255,0.5);">
    </div>
    <div id="itemList"></div>
  </div>

  <div class="section">
    <div class="ledger-title">ใบเสร็จ <span class="hint">ยืนยันคำสั่งซื้อเพื่อแจ้ง DM ทาง Discord</span></div>
    <div class="receipt" id="receiptBox">
      <p class="receipt-empty">ยังไม่มีรายการซื้อ</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button class="buy-btn" onclick="confirmOrder()" style="width:100%;">ยืนยันคำสั่งซื้อ (ส่งเข้า Discord)</button>
      <div style="display: flex; gap: 8px;">
        <button class="copy-btn" onclick="copyReceipt()" style="flex: 1;">คัดลอกใบเสร็จ</button>
        <button class="reset-btn" onclick="clearCart()" style="flex: 1; background-color: #e08a8a; border-color: #e08a8a;">ล้างใบเสร็จ</button>
      </div>
    </div>
    <span class="copy-status" id="copyStatus"></span>
  </div>
</div>

<script src="app.js"></script>
<script src="player.js"></script>
<script>
// Initialize on load
initializeData();
loadShop();
</script>

</body>
</html>
